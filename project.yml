name: 3MF Thumbnail
options:
  bundleIdPrefix: me.zhanghai
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    majorVersion: 0.9

targets:
  3MF Thumbnail:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: ThumbnailExtension
      - target: PreviewExtension
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.zhanghai.3mf-thumbnail
        PRODUCT_NAME: 3MF Thumbnail
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ENABLE_APP_SANDBOX: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 3MF Thumbnail
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.3mf.threemfproject
            UTTypeDescription: 3D Manufacturing Format
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - 3mf
              public.mime-type:
                - application/vnd.ms-package.3dmanufacturing-3dmodel+xml
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    product: ThumbnailExtension
    sources:
      - path: ThumbnailExtension
      - path: Shared
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.zhanghai.3mf-thumbnail.ThumbnailExtension
        PRODUCT_NAME: ThumbnailExtension
        INFOPLIST_FILE: ThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThumbnailExtension/ThumbnailExtension.entitlements
        ENABLE_APP_SANDBOX: true
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: ThumbnailExtension
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.3mf.threemfproject
            QLThumbnailMinimumDimension: 0
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true

  PreviewExtension:
    type: app-extension
    platform: macOS
    product: PreviewExtension
    sources:
      - path: PreviewExtension
      - path: Shared
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.zhanghai.3mf-thumbnail.PreviewExtension
        PRODUCT_NAME: PreviewExtension
        INFOPLIST_FILE: PreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/PreviewExtension.entitlements
        ENABLE_APP_SANDBOX: true
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: PreviewExtension
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.3mf.threemfproject
            QLSupportsSearchableItems: false
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
